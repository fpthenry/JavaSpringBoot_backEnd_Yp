<!-- Sửa tay: thẻ đăng nhập giữa màn hình -->
<div class="auth-page">
  <div class="auth-card surface">
    <div>
      <div class="auth-brand">
        <span class="auth-brand-mark">YP</span>
        <span jhiTranslate="global.title">Trang Vàng – Quản trị</span>
      </div>
      <h1 class="page-title mb-3" data-cy="loginTitle" jhiTranslate="login.title">Sign in</h1>
      @if (authenticationError()) {
        <div class="alert alert-danger" data-cy="loginError" jhiTranslate="login.messages.error.authentication">
          <strong>Failed to sign in!</strong> Please check your credentials and try again.
        </div>
      }
      <form class="form" (ngSubmit)="login()" [formGroup]="loginForm">
        <div class="mb-3">
          <label class="form-label" for="username" jhiTranslate="global.form.username.label">Username</label>
          <input
            type="text"
            #username
            class="form-control"
            name="username"
            id="username"
            placeholder="{{ 'global.form.username.placeholder' | translate }}"
            formControlName="username"
            data-cy="username"
          />
        </div>

        <div class="mb-3">
          <label class="form-label" for="password" jhiTranslate="login.form.password">Password</label>
          <input
            type="password"
            class="form-control"
            name="password"
            id="password"
            placeholder="{{ 'login.form.password.placeholder' | translate }}"
            formControlName="password"
            data-cy="password"
          />
        </div>

        <div class="d-flex flex-wrap justify-content-between gap-2 mb-3">
          <div class="form-check mb-0">
            <label class="form-check-label" for="rememberMe">
              <input class="form-check-input" type="checkbox" name="rememberMe" id="rememberMe" formControlName="rememberMe" />
              <span jhiTranslate="login.form.rememberme">Remember me</span>
            </label>
          </div>
          <a routerLink="/account/reset/request" data-cy="forgetYourPasswordSelector" jhiTranslate="login.password.forgot"
            >Did you forget your password?</a
          >
        </div>

        <button type="submit" class="btn btn-primary w-100" data-cy="submit" jhiTranslate="login.form.button">Sign in</button>
      </form>

      <!-- Sửa tay (bảo mật): bỏ link "Đăng ký tài khoản mới" — tự đăng ký đã tắt; tài khoản do quản trị viên tạo -->
    </div>
  </div>
</div>
