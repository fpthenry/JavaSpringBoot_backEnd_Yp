<div>
  <h2 id="page-heading" data-cy="LocationTreeHeading">
    <span jhiTranslate="javaSpringBootBackEndApp.location.tree.title">Đơn vị hành chính</span>

    <div class="d-flex justify-content-end">
      <button class="btn btn-info me-2" (click)="tree.load()" [disabled]="tree.isLoading()">
        <fa-icon icon="sync" [animation]="tree.isLoading() ? 'spin' : undefined" />
        <span jhiTranslate="javaSpringBootBackEndApp.location.home.refreshListLabel">Làm mới</span>
      </button>

      <a class="btn btn-primary" routerLink="/location">
        <fa-icon icon="list" />
        <span jhiTranslate="javaSpringBootBackEndApp.location.tree.listView">Dạng bảng</span>
      </a>
    </div>
  </h2>

  <jhi-alert-error />

  <jhi-tree-view
    #tree
    [source]="source"
    entityRoute="/location"
    listingFilterName="locationTreeId.equals"
    [isLeaf]="isLeaf"
    [itemLabel]="typeLabel"
    leafIcon="location-dot"
  />
</div>
