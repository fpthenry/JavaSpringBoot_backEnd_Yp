<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (cachedContent(); as cachedContentRef) {
      <div>
        <h2 data-cy="cachedContentDetailsHeading">
          <span jhiTranslate="javaSpringBootBackEndApp.cachedContent.detail.title">Cached Content</span>
        </h2>

        <hr />

        <jhi-alert-error />

        <jhi-alert />

        <dl class="row-md jh-entity-details">
          <dt><span jhiTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ cachedContentRef.id }}</span>
          </dd>
          <dt><span jhiTranslate="javaSpringBootBackEndApp.cachedContent.termSlug">Term Slug</span></dt>
          <dd>
            <span>{{ cachedContentRef.termSlug }}</span>
          </dd>
          <dt><span jhiTranslate="javaSpringBootBackEndApp.cachedContent.expired">Expired</span></dt>
          <dd>
            <span>{{ cachedContentRef.expired | formatMediumDatetime }}</span>
          </dd>
          <dt><span jhiTranslate="javaSpringBootBackEndApp.cachedContent.content">Content</span></dt>
          <dd>
            <span>{{ cachedContentRef.content }}</span>
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Back</span>
        </button>

        <button type="button" [routerLink]="['/cached-content', cachedContentRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
