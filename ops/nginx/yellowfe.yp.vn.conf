# nginx: website — https://yellowfe.yp.vn → Next.js 127.0.0.1:3000
# Chép vào /etc/nginx/sites-available/, ln -s sang sites-enabled/, rồi: nginx -t && systemctl reload nginx
# Sau này chuyển sang yp.vn: đổi server_name thành "yp.vn www.yp.vn", chạy lại certbot, đổi NEXT_PUBLIC_SITE_URL
# trong .env.production của FE rồi build lại. Xem docs/TONG-HOP-DU-AN.md mục 18.
server {
    listen 80;
    listen [::]:80;
    server_name yellowfe.yp.vn;

    client_max_body_size 10m;

    # BẬT KHI CHUYỂN SANG yp.vn: kho ảnh/file WordPress cũ. Dữ liệu (logo, ảnh doanh nghiệp, bài viết, banner) lưu link
    # tuyệt đối https://yp.vn/wp-content/uploads/... — chép thư mục uploads từ máy chủ cũ về /opt/yp/wp-content/uploads
    # (docs/TONG-HOP-DU-AN.md mục 18). Chỉ phục vụ file tĩnh, không chạy/hiển thị file kịch bản.
    # location /wp-content/uploads/ {
    #     root /opt/yp;
    #     expires 30d;
    #     add_header X-Content-Type-Options nosniff always;
    #     location ~* \.(php\d?|phtml|pl|py|sh|cgi|html?|svg|js)$ { return 404; }
    # }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

# BẬT SAU KHI CHUYỂN SANG yp.vn (khối trên đã đổi server_name thành "yp.vn www.yp.vn"): mọi đường dẫn của tên miền
# chạy thử chuyển 301 sang yp.vn — link yellowfe lỡ bị chia sẻ/lập chỉ mục dồn về yp.vn. HTTPS: certbot --nginx -d yellowfe.yp.vn
