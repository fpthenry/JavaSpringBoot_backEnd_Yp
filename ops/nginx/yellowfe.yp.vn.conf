# nginx: website — https://yellowfe.yp.vn → Next.js 127.0.0.1:3000
# Chép vào /etc/nginx/sites-available/, ln -s sang sites-enabled/, rồi: nginx -t && systemctl reload nginx
# Sau này chuyển sang yp.vn: đổi server_name thành "yp.vn www.yp.vn", chạy lại certbot, đổi NEXT_PUBLIC_SITE_URL
# trong .env.production của FE rồi build lại. Xem docs/TONG-HOP-DU-AN.md mục 9.5.
server {
    listen 80;
    listen [::]:80;
    server_name yellowfe.yp.vn;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
