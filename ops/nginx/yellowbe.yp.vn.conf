# nginx: backend + trang quản trị — https://yellowbe.yp.vn → Spring Boot 127.0.0.1:8080
# Chép vào /etc/nginx/sites-available/, ln -s sang sites-enabled/, rồi: nginx -t && systemctl reload nginx
# HTTPS: chạy certbot --nginx (tự thêm khối 443 và chuyển http → https). Xem docs/TONG-HOP-DU-AN.md mục 18.

# Chống dò mật khẩu: tối đa 10 lần đăng nhập / phút / IP (vượt → 429).
# Nếu bật proxy Cloudflare (đám mây cam): bắt buộc cấu hình IP thật (conf.d/cloudflare-realip.conf, mục 18.3 bước 9),
# không thì mọi người dùng chung IP Cloudflare và bị chặn lẫn nhau.
limit_req_zone $binary_remote_addr zone=yp_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name yellowbe.yp.vn;

    # Nhập doanh nghiệp từ Excel/CSV (backend nhận tới 100 MB — spring.servlet.multipart), upload ảnh banner
    client_max_body_size 100m;

    # API + trang quản trị: không bao giờ cho Google lập chỉ mục (kể cả ảnh banner /api/public/v1/media/...)
    add_header X-Robots-Tag "noindex, nofollow" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    location = /api/authenticate {
        limit_req zone=yp_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        # Nhập file lớn, reindex… có thể chạy lâu
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
